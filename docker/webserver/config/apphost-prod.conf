server {
	listen 443;
	server_name 	${SERVER_NAME};

	ssl on;
	ssl_certificate /var/webapps_ssl/certificate.crt;
	ssl_certificate_key /var/webapps_ssl/certificate.key;

	root /var/webapps/public;
	index index.htm index.html index.php;

	location / {
		try_files ${STRING_VAR}uri ${STRING_VAR}uri/ /index.php;
	}

	# optimize
	client_max_body_size   30M;
	client_body_buffer_size 30M;
	client_body_timeout	6000;
	client_header_timeout  6000;
	send_timeout		   6000;

	# security
	server_tokens   off;

#	#set brutforce login zone max 1 request per second per client
#	limit_req_zone $binary_remote_addr zone=login_app:10m rate=1r/s;
#
#	#limit connection per ip
#	limit_conn perip 10;
#
#	#protect /authentication
#	location ~/authentication {
#		limit_req zone=login_app; #use authentication limit_req_zone
#		limit_req_status 444; #return 444 when limiting
#	}
#
#	#protect /register
#	location ~/register {
#		limit_req zone=login_app; #use register limit_req_zone
#		limit_req_status 444; #return 444 when limiting
#	}

	location ~ /\.(?!well-known).* { 
		access_log off; 
		log_not_found off; 
		deny all; 
	}
	
	location ~ ~${STRING_VAR} { 
		access_log off; 
		log_not_found off; 
		deny all; 
	}

	location = /robots.txt { 
		access_log off; 
		log_not_found off; 
	}

    location = /favicon.ico { 
		access_log off; 
		log_not_found off; 
	}

	error_page 403 = 404; # permission dedied to page not found
	error_page 405 = 404; # method not allowed to page not found

	if (${STRING_VAR}request_method !~ ^(GET|HEAD|POST)${STRING_VAR} )
	{
		return 405;
	}

	add_header Access-Control-Allow-Methods "GET, POST, HEAD";

	add_header Access-Control-Allow-Origin "*";
	
	add_header Cross-Origin-Embedder-Policy "require-corp";
	add_header Cross-Origin-Resource-Policy "same-origin";
	
	add_header Cross-Origin-Opener-Policy "same-origin";
	#add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-XSS-Protection "1; mode=block";

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
	add_header X-Content-Type-Options nosniff;
	add_header Referrer-Policy "strict-origin";

	#add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";
	# add_header Permissions-Policy "geolocation=(self),fullscreen=(self),camera=()";
	
	# add_header Content-Security-Policy "default-src 'self'; font-src *;img-src * data:; script-src *; style-src *";
	add_header Content-Security-Policy "default-src 'self'; 
    script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com; 
    frame-src https://www.google.com https://www.gstatic.com; 
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
    font-src 'self' https://fonts.gstatic.com; 
    connect-src 'self' https://api.kemenimipas.go.id/;
    img-src 'self' data: https://www.gstatic.com https://www.google.com https://maps.google.com https://maps.googleapis.com;";

	location ~ /\.svn {
		deny all;
	}
	
	error_page 404 /40x.html;
	error_page 500 502 503 504 /50x.html;

	# caches
	location ~* \.(jpg|jpeg|gif|css|png|js|ico|html)$ {
		access_log off;
		expires max;
	}

	location ~* \.(css|js|ico|html)$ {
		access_log off;
		expires max;
	}

	location ~* \.(woff|svg)$ {
		access_log off;
		log_not_found off;
		expires 30d;
	}

	location ~* \.(js)$ {
		access_log off;
		log_not_found off;
		expires 7d;
		add_header Cache-Control "public, no-transform";
	}

	# php platform
	location ~ \.php${STRING_VAR} {
		fastcgi_pass php-fpm;
		fastcgi_index index.php;
		fastcgi_param  SCRIPT_FILENAME /var/webapps/public${STRING_VAR}fastcgi_script_name;
		include fastcgi_params;
		fastcgi_param CI_ENV ${APP_ENVIRONMENT};
		fastcgi_read_timeout 300;
	}
}

