upstream php-fpm {
	server ${PLATFORM_SERVER};
	server ${PLATFORM_SERVER_1};
	server ${PLATFORM_SERVER_2};
	server ${PLATFORM_SERVER_3};
	server ${PLATFORM_SERVER_4};
}

server {
	listen 	80;
	server_name 	star-sign.kemenimipas.go.id;

	root /var/webapps/sites;
	index index.htm index.html;

	# optimize
	client_max_body_size   15M;
	client_body_timeout	3000;
	client_header_timeout  3000;
	send_timeout		   3000;

	# security
	server_tokens   off;

	location / {
        #customize you want add variable
        proxy_set_header X-Real-IP ${STRING_VAR}remote_addr;
        proxy_set_header X-Forwarded-For ${STRING_VAR}remote_addr;

        # set new variable get HTTP_X_REAL_HOST_REQ in header when sub folder
        #proxy_set_header X-Real-Host-Req ${STRING_VAR}host/subfoler;
        proxy_set_header X-Real-Host-Req ${STRING_VAR}host;

        proxy_set_header Host ${STRING_VAR}host;
        proxy_set_header X-Forwarded-Proto ${STRING_VAR}scheme;

        proxy_pass http://10.0.49.210:10680/;
    }
}