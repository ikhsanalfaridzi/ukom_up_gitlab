date.timezone = Asia/Jakarta

expose_php = Off
display_startup_errors = Off
display_errors = Off

;allow_url_fopen = Off
;allow_url_include = Off

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.revalidate_path = 1
realpath_cache_size = 4096k
realpath_cache_ttl = 600

max_execution_time = 300
max_input_time = 300
memory_limit = 1024M

max_input_vars = 100000
upload_max_filesize = 25M
post_max_size = 30M

disable_functions = exec,passthru,shell_exec,show_source,pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals